name: Deploy to VPS

on:
  push:
    branches:
      - dev
 
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22

          script: |
            # Load NVM
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Pull latest code
            cd /home/vantai/projects/Coffee4Student-server
            git fetch origin
            git reset --hard origin/dev

            # ===== DEPLOY AI (DOCKER) =====
            echo " Deploying AI Service..."
            cd ai-recommendation
            
            # Stop old container
            docker stop coffee-ai 2>/dev/null || true
            docker rm coffee-ai 2>/dev/null || true
            
            # Build new image
            docker build -t coffee-ai:latest .
            
            # Run new container
            docker run -d \
              --name coffee-ai \
              --restart unless-stopped \
              -p 127.0.0.1:5001:5001 \
              --env-file .env \
              coffee-ai:latest
            
            # Wait for AI to start
            sleep 5
            
            # Check AI health
            curl -f http://127.0.0.1:5001/health || exit 1

            # ===== DEPLOY BACKEND (PM2) =====
            echo "🚀 Deploying Backend..."
            cd ../back-end
            npm install
            pm2 restart server || pm2 start server.js --name server

            echo " Deploy completed!"





